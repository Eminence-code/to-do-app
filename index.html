<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>TaskFlow<span>.</span></h1>
            <p>Organize your daily tasks and stay productive.</p>
        </header>

        <main class="todo-app">

            <!-- Add Task -->
            <form id="taskForm" class="task-form">
                <input type="text" id="taskInput" placeholder="What do you need to do?" maxlength="120"
                    autocomplete="off" aria-label="Enter a new task">
                <button type="submit" class="add-btn">+ Add Task</button>
            </form>

            <!-- Search -->
            <div class="search-box">
                <input type="search" id="searchInput" placeholder="Search your tasks..." aria-label="Search tasks">
            </div>

            <!-- Filters -->
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Progress -->
            <section class="progress-section">
                <div class="progress-info">
                    <span>My Progress</span>
                    <span id="progressText">0% completed</span>
                </div>

                <div class="progress-track">
                    <div id="progressBar" class="progress-bar"></div>
                </div>

                <div class="task-stats">
                    <span id="totalCount">0 total tasks</span>
                    <span id="completedCount">0 completed</span>
                </div>
            </section>

            <!-- Task List -->
            <section class="task-section">
                <div class="section-heading">
                    <h2>My Tasks</h2>
                    <button id="clearCompleted" class="clear-btn">
                        Clear Completed
                    </button>
                </div>

                <ul id="taskList" class="task-list"></ul>

                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">✓</div>
                    <h3>No tasks yet!</h3>
                    <p>Add a task and start being productive.</p>
                </div>
            </section>

        </main>

        <footer>
            <p>Made with ♥ using HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>

</html>
